<button id='pb' class='h' aria-label='暫停'>Ⅱ</button><div id="ov"><h1 id="ti">太極渡</h1><p class="s" id="su">陰陽相濟　氣歸其根</p><p class="t" id="tp">拖曳／滑鼠／WASD 移動　點擊／空白鍵 轉換陰陽<br>吸收同色之氣，閃避異色煞氣<br>連吸聚氣，氣滿發「太極破」清場<br>每三次太極破，方回一點元神</p><button id="bt">入道</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),X=cv.getContext('2d'),R=Math.random,TAU=Math.PI*2,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),P5=[0,2,4,7,9],FN="'Noto Serif TC','Songti TC',serif";
let W,H,S,vig,pal={},st='menu',P={x:0,y:0},V={x:0,y:0},T={x:0,y:0},pol,rot,rotT,life,score,combo,cT,qi,inv,shake=0,flash=0,fc='#000',ts=1,stop=0,tm=0,L,bl,pt,tr,tmr,wv,gap,msg,pulse=0,best=0,deadT,AC,last=0,K={},pd=null,spr=[],bu=0,cd=0,DF=1,cur='home',ret='home';
try{best=+localStorage.getItem('tjd')||0}catch(e){}

try{Object.assign(SET,JSON.parse(localStorage.getItem('tjs')))}catch(e){}

function theme(){const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();pal.p=g('--p');pal.i=g('--i');pal.g=g('--g');const c=parseInt(pal.p.slice(1),16);pal.d=((c>>16)*.3+((c>>8&255)*.6)+(c&255)*.1)<110;pal.c=[pal.d?'#ffd36b':'#b9801c',pal.d?'#8f9bff':'#1a1612','#d23a2c']}
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;X.setTransform(d,0,0,d,0,0);S=cl(Math.min(W,H)/640,.7,1.3);vig=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.hypot(W,H)*.56);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.3)')}
function mk(){[0,1].forEach(k=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,4,32,32,30);r.addColorStop(0,k?'rgba(110,125,255,.55)':'rgba(255,205,90,.65)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);g.beginPath();g.arc(32,32,11,0,TAU);g.fillStyle=k?'#14110d':'#fbf6e6';g.fill();g.lineWidth=2.5;g.strokeStyle=k?'#ece5d0':'#2a241b';g.stroke();spr[k]=c})}
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function snd(f,ty,g,d,sl){if(!AC||!SET.snd)return;const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(f*sl,t+d);a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+d)}
function reset(){P={x:W/2,y:H*.72};V={x:0,y:0};T={x:P.x,y:P.y};pol=0;rot=rotT=0;life=3;score=0;combo=0;cT=0;qi=0;inv=0;shake=0;flash=0;tm=0;L=1;bl=[];pt=[];tr=[];tmr=[];wv=[];gap=1.2;msg=null;ts=1;stop=0;deadT=0;bu=0}
function banner(l){msg={t:2.2,s:typeof l=='number'?'第'+'一二三四五六七八九'[l-1]+'重天':l}}
function burst(x,y,n,k,sp,l,a){for(let i=0;i<n;i++){const an=R()*TAU,s=sp*(.3+R()*.7);pt.push({x,y,vx:Math.cos(an)*s,vy:Math.sin(an)*s,l:l*(.6+R()*.6),m:l,s:(1.5+R()*2.5)*S,k,a})}}
const shoot=(x,y,a,s,k,o)=>bl.push({x,y,vx:Math.cos(a)*s*S*DF,vy:Math.sin(a)*s*S*DF,k,...o}),later=(t,f)=>tmr.push({t,m:t,f});
const pat=[
(x,y)=>{const n=14+L*2,o=R()*TAU,u=2+(R()*2|0);for(let i=0;i<n;i++)shoot(x,y,o+i/n*TAU,150+L*9,(i/u|0)%2)},
(x,y)=>{const o=R()*TAU,d=R()<.5?1:-1;for(let i=0;i<24;i++)later(i*.075,()=>shoot(x,y,o+d*i*.45,165+L*7,(i/3|0)%2))},
(x,y)=>{const a=Math.atan2(P.y-y,P.x-x);for(let i=-3;i<=3;i++)shoot(x,y,a+i*.17,200+L*9,(R()<.35?1:0)^(Math.abs(i)&1))},
()=>{const k=R()*2|0,x0=R()*W;for(let i=0;i<9;i++)later(i*.11,()=>shoot(x0+(R()-.5)*160*S,-12,1.57+(R()-.5)*.25,220+L*8,k))},
(x,y)=>{for(let i=0;i<6;i++)later(i*.13,()=>shoot(x,y,Math.atan2(P.y-y,P.x-x),340+L*10,i&1))},
()=>{const x0=W*(.2+R()*.6);for(let i=0;i<18;i++)later(i*.1,()=>{shoot(x0,-12,1.57,175+L*6,0,{sw:1});shoot(x0,-12,1.57,175+L*6,1,{sw:1,ph:3.14})})},
()=>{const g=38*S,u=2+(R()*3|0),o=R()*2|0;for(let r=0;r<3;r++)later(r*1.2,()=>{for(let i=0;i<=W/g;i++)shoot(i*g,-14,1.57,95+L*4,((i/u|0)+o+r)%2)})},
(x,y)=>{const a=Math.atan2(P.y-y,P.x-x);for(let i=0;i<12;i++)shoot(x,y,a+(i-5.5)*.28,150+L*6,i&1,{av:i&1?.9:-.9})},
(x,y)=>{for(let s=0;s<32;s++)later(s*.09,()=>{shoot(x,y,s*.33,175+L*6,0);shoot(x,y,3.4-s*.33,175+L*6,1)})},
(x,y)=>{for(let s=0;s<22;s++)later(s*.13,()=>{for(let i=0;i<8;i++)shoot(x,y,s*.21+i*.7854,125+L*5,(i+(s/6|0))%2)})},
(x,y)=>{const a=Math.atan2(P.y-y,P.x-x);for(let i=0;i<3+(L>6);i++)shoot(x,y,a+(i-1)*.55,120+L*4,R()*2|0,{z:1.8,fu:1.2+i*.25})}];
['環劫','回風','破空','落雨','金·疾矢','水·雙流','土·陰陽牆','木·藤蔓','太極雙旋','八卦陣','火·爆裂'].forEach((n,i)=>pat[i].nm=n);[3,5,6].forEach(i=>pat[i].top=1);
function spawn(){const f=pat[R()*Math.min(pat.length,3+(L-1)*3)|0];let x,y,n=0;if(f.top){x=W*(.15+R()*.7);y=24}else do{x=W*(.12+R()*.76);y=H*(.1+R()*.5)}while(Math.hypot(x-P.x,y-P.y)<200*S&&n++<9);tmr.push({t:.75,m:.75,x,y,n:f.nm,f:()=>{f(x,y);burst(x,y,14,R()*2|0,240,.5);wv.push({x,y,r:0,a:0,m:80*S,t:.4,k:0,w:3})}})}
function flip(){if(st!='play')return;pol^=1;rotT+=Math.PI;stop=.045;shake=Math.max(shake,3);wv.push({x:P.x,y:P.y,r:0,a:0,m:130*S,t:.35,k:pol,w:3});burst(P.x,P.y,14,pol,260,.5);snd(pol?98:131,'sine',.22,.4,.5);snd(pol?330:440,'triangle',.05,.15,1.6)}
function absorb(b){combo++;cT=2.6;const m=1+(combo/5|0);score+=10*m;qi=Math.min(100,qi+Math.max(.8,2.4-bu*.4));burst(b.x,b.y,5,b.k,200,.45,1);pulse=1;snd(262*2**((P5[combo%5]+12*((combo/5|0)%3))/12),'triangle',.11,.4);if(qi>=100)qiBurst()}
function qiBurst(){qi=0;bu++;if(bu%3==0&&life<3){life++;banner('元神歸位')}wv.push({x:P.x,y:P.y,r:0,a:0,m:Math.hypot(W,H),t:1.1,k:pol,w:9,big:1});shake=16;flash=.7;fc=pal.c[0];ts=.35;stop=.08;[0,2,4,7,9,12].forEach((n,i)=>setTimeout(()=>snd(392*2**(n/12),'triangle',.1,.7),i*70))}
function hit(){if(--life<=0){die();return}inv=1.5;qi=Math.max(0,qi-35);shake=18;flash=.6;fc=pal.c[2];stop=.09;combo=0;burst(P.x,P.y,36,2,520,.8);bl=bl.filter(b=>{if(Math.hypot(b.x-P.x,b.y-P.y)<150*S){burst(b.x,b.y,2,b.k,120,.4);return false}return true});snd(70,'sawtooth',.25,.6,.3)}
function die(){st='dead';life=0;burst(P.x,P.y,70,0,700,1.4);burst(P.x,P.y,70,1,700,1.4);burst(P.x,P.y,30,2,500,1.2);shake=26;flash=.9;fc=pal.c[2];ts=.25;stop=.15;snd(55,'sawtooth',.3,1.4,.3);deadT=0;if(score>best){best=score;try{localStorage.setItem('tjd',best)}catch(e){}}cv.style.cursor=''}
function over(){scr('over')}
function pause(){if(st!='play')return;st='pause';pd=null;cv.style.cursor='';try{AC.suspend()}catch(e){}scr('pause')}
function act(a){if(document.activeElement)document.activeElement.blur();
if(a=='start'||a=='restart'||a=='resume'){ac();$('ov').classList.add('h');cv.style.cursor='none';if(a=='resume'){st='play';cd=1.65;inv=Math.max(inv,.8)}else{theme();reset();banner(1);st='play';cd=0}}
else if(a=='home'){reset();st='menu';cv.style.cursor='';scr('home')}
else if(a=='rules'||a=='set'){ret=cur;scr(a)}
else if(a=='back')scr(ret)}
function scr(n){cur=n;const B=(a,t,c)=>`<button class='m ${c||''}' data-a='${a}'>${t}</button>`,D='一二三四五六七八九'[L-1];let h;
if(n=='home')h=`<h1>太極渡</h1><p class='s'>陰陽相濟　氣歸其根</p><p class='t'>最高修為　${best}</p>`+B('start','入道','p')+B('rules','玩法說明')+B('set','設置');
else if(n=='pause')h=`<h1>坐忘</h1><p class='s'>靜心片刻</p><p class='t'>第${D}重天　修為 ${score}</p>`+B('resume','繼續','p')+B('restart','重修')+B('set','設置')+B('home','回主頁');
else if(n=='over')h=`<h1>道消</h1><p class='s'>修為 ${score}</p><p class='t'>最高 ${best}　止於第${D}重天${score>=best&&score>0?'<br>★ 新紀錄':''}</p>`+B('start','重修','p')+B('home','回主頁');
else if(n=='set')h='<h2>設置</h2>'+Object.keys(OPT).map(k=>`<div class='r'><span>${LB[k]}</span><button class='o' data-k='${k}'>${OPT[k][SET[k]]}</button></div>`).join('')+B('back','返回');
else h=`<h2>玩法說明</h2><div class='u'><p>【移動】手機用手指在畫面上拖；電腦用滑鼠，或按 WASD／方向鍵。</p><p>【換色】手機輕點一下；電腦點滑鼠或按空白鍵。太極球會在白、黑之間切換。</p><p>【吸收】<i class='d d0'></i> 白氣和 <i class='d d1'></i> 黑氣會飛過來。跟你目前同色的，碰到就能吸收並得分。</p><p>【受傷】顏色不同的，碰到會扣一點「元神」，也就是生命（右上角的小太極，一開始有三個），扣光就結束。</p><p>【連擊】連續吸收，得分倍率會越來越高；一受傷就歸零。</p><p>【太極破】下方的氣條滿了，會自動放出衝擊波，清掉畫面上所有彈幕。每放三次，補回一點元神。</p><p>【難度】一共九重天，越往後彈幕越多，還會出現新招式。</p><p>【暫停】按 Esc 或 P，或點畫面上方的 Ⅱ。</p></div>`+B('back','返回');
$('ov').innerHTML=h;$('ov').classList.remove('h')}
function update(dt,rdt,t){
if(st!='dead'){
if(st=='menu'){T.x=W/2+Math.sin(t*.9)*W*.22;T.y=H*.7+Math.sin(t*1.7)*H*.05}
else{const dx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),dy=(K.KeyS||K.ArrowDown?1:0)-(K.KeyW||K.ArrowUp?1:0);if(dx||dy){const n=Math.hypot(dx,dy),v=640*S*dt;T.x=cl(T.x+dx/n*v,P.x-140,P.x+140);T.y=cl(T.y+dy/n*v,P.y-140,P.y+140)}}
T.x=cl(T.x,14,W-14);T.y=cl(T.y,14,H-14);
for(let i=0;i<2;i++){const h=dt/2;V.x+=((T.x-P.x)*1000-V.x*56)*h;V.y+=((T.y-P.y)*1000-V.y*56)*h;const s=Math.hypot(V.x,V.y),m=1900*S;if(s>m){V.x*=m/s;V.y*=m/s}P.x+=V.x*h;P.y+=V.y*h}
if(P.x<14){P.x=14;V.x*=-.3}if(P.x>W-14){P.x=W-14;V.x*=-.3}if(P.y<14){P.y=14;V.y*=-.3}if(P.y>H-14){P.y=H-14;V.y*=-.3}
rot+=(rotT-rot)*(1-Math.exp(-16*dt));if(dt>0){tr.push({x:P.x,y:P.y,k:pol});if(tr.length>26)tr.shift()}}
if(st=='play'){tm+=dt;cT-=dt;if(cT<=0)combo=0;inv-=dt;const nl=Math.min(9,1+(tm/13|0));if(nl>L){L=nl;banner(L);snd(147,'sine',.3,1.5)}
gap-=dt;if(gap<=0&&bl.length<360){gap=Math.max(.6,2-L*.14)/DF*(.8+R()*.4);spawn();if(L>2&&R()<.5)spawn();if(L>6&&R()<.4)spawn()}
for(let i=tmr.length-1;i>=0;i--){const o=tmr[i];o.t-=dt;if(o.t<=0){tmr.splice(i,1);o.f()}}}
let hf=0;const mg=95*S,ab=25*S,hr=10*S;
for(let i=bl.length-1;i>=0;i--){const b=bl[i];
if(st=='play'){const dx=P.x-b.x,dy=P.y-b.y,d=Math.hypot(dx,dy)||1;
if(b.k==pol){if(d<mg){const f=(1-d/mg)*1500*dt;b.vx+=dx/d*f;b.vy+=dy/d*f}if(d<ab*(b.z||1)){absorb(b);bl.splice(i,1);continue}}else if(d<hr*(b.z||1)&&inv<=0)hf=1}
if(b.av){const c=Math.cos(b.av*dt),s=Math.sin(b.av*dt),u=b.vx*c-b.vy*s;b.vy=b.vx*s+b.vy*c;b.vx=u}
if(b.sw){b.sx=b.sx==null?b.x:b.sx;b.t=(b.t||0)+dt;b.x=b.sx+Math.sin(b.t*4.5+(b.ph||0))*70*S}
if(b.fu!=null&&(b.fu-=dt)<=0){const o=R()*TAU;for(let j=0;j<10;j++)shoot(b.x,b.y,o+j*TAU/10,130+L*5,j%2);burst(b.x,b.y,18,b.k,260,.5);wv.push({x:b.x,y:b.y,r:0,a:0,m:90*S,t:.4,k:b.k,w:4});snd(180,'sawtooth',.12,.3,.4);bl.splice(i,1);continue}
b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-70||b.x>W+70||b.y<-70||b.y>H+70)bl.splice(i,1)}
if(hf)hit();
for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.l-=dt;if(p.l<=0){pt.splice(i,1);continue}const f=Math.exp(-3*dt);p.vx*=f;p.vy*=f;if(p.a){const dx=P.x-p.x,dy=P.y-p.y;p.vx+=dx*16*dt;p.vy+=dy*16*dt;if(dx*dx+dy*dy<200&&st=='play'){pt.splice(i,1);continue}}p.x+=p.vx*dt;p.y+=p.vy*dt}
for(let i=wv.length-1;i>=0;i--){const o=wv[i];o.a+=dt;if(o.a>=o.t){wv.splice(i,1);continue}o.r=o.m*(1-(1-o.a/o.t)**3);if(o.big)bl=bl.filter(b=>{if(Math.hypot(b.x-o.x,b.y-o.y)<o.r){burst(b.x,b.y,3,b.k,150,.5,1);score+=5*(1+(combo/5|0));return false}return true})}
